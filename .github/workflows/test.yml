name: Python Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    runs-on: ubuntu-latest
    if: "!endsWith(github.event.head_commit.message, '!ci')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          version: "latest"
          enable-cache: true
      - name: Run tests
        run: |
          python -V
          uv sync
          uv run pytest . -s -v --cov=src --cov-report=xml --junitxml=junit.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
